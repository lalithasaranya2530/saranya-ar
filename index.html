<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Album</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

#startButton{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
z-index:9999;
background:#000;
color:#fff;
}

.hide{
display:none;
}
</style>

</head>

<body>

<button id="startButton">
Tap To Start Audio
</button>

<a-scene
mindar-image="imageTargetSrc: ./targets.mind; maxTrack:1;"
color-space="sRGB"
renderer="colorManagement:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false"
embedded
>

<a-assets>

<video
id="Saranya"
src="./videos/Saranya.mp4"
loop
playsinline
webkit-playsinline
crossorigin="anonymous"
preload="auto"
></video>

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

</a-scene>

<script>

const scene=document.querySelector("a-scene");

const video=document.querySelector("#Saranya");

const startButton=document.querySelector("#startButton");

const TOTAL_MARKERS=30;

let audioUnlocked=false;


// mobile audio unlock
startButton.addEventListener("click",async()=>{

try{

video.muted=false;

await video.play();

video.pause();

video.currentTime=0;

audioUnlocked=true;

startButton.classList.add("hide");

}catch(e){

console.log(e);

}

});



for(let i=0;i<TOTAL_MARKERS;i++){

let marker=document.createElement("a-entity");

marker.setAttribute(
"mindar-image-target",
`targetIndex:${i}`
);


let videoPlane=document.createElement("a-video");

videoPlane.setAttribute(
"src",
"#Saranya"
);

videoPlane.setAttribute(
"width",
"1"
);

videoPlane.setAttribute(
"height",
"1.5"
);

videoPlane.setAttribute(
"position",
"0 0 0");


marker.appendChild(videoPlane);



marker.addEventListener(
"targetFound",
()=>{

if(audioUnlocked){

video.currentTime=0;

video.play();

}

}
);



marker.addEventListener(
"targetLost",
()=>{

video.pause();

video.currentTime=0;

}
);

scene.appendChild(marker);

}

</script>

</body>
</html>
