<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AR Album Responsive</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body{
margin:0;
overflow:hidden;
}
</style>

</head>

<body>

<a-scene
mindar-image="imageTargetSrc: ./targets.mind; maxTrack:1;"
color-space="sRGB"
renderer="colorManagement:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false"
embedded
>

<a-assets>

<video id="video001"
src="./videos/001.mp4"
playsinline
webkit-playsinline
crossorigin="anonymous">
</video>

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

</a-scene>

<script>

const scene=document.querySelector("a-scene");

const MAX_TARGETS=30;

function formatNumber(num){
return String(num).padStart(3,'0');
}

for(let i=0;i<MAX_TARGETS;i++){

let marker=document.createElement("a-entity");

marker.setAttribute(
"mindar-image-target",
`targetIndex:${i}`
);

let video=document.createElement("video");

let videoID="video"+formatNumber(i+1);

video.setAttribute("id",videoID);

video.setAttribute(
"src",
`./videos/${formatNumber(i+1)}.mp4`
);

video.setAttribute("playsinline","");
video.setAttribute("webkit-playsinline","");
video.setAttribute("crossorigin","anonymous");

document
.querySelector("a-assets")
.appendChild(video);

let plane=document.createElement("a-video");

plane.setAttribute(
"src",
`#${videoID}`
);

plane.setAttribute(
"position",
"0 0 0"
);

plane.setAttribute(
"width",
"1"
);

plane.setAttribute(
"height",
"1.5"
);

marker.appendChild(plane);

marker.addEventListener(
"targetFound",
()=>{
video.play();
}
);

marker.addEventListener(
"targetLost",
()=>{
video.pause();
video.currentTime=0;
}
);

scene.appendChild(marker);

}

</script>

</body>
</html>
