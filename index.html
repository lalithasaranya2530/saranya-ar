<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Album</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
}

#startBtn{
position:fixed;
z-index:9999;
left:50%;
bottom:30px;
transform:translateX(-50%);
padding:12px 20px;
font-size:18px;
border-radius:12px;
border:none;
}

.hide{
display:none;
}
</style>
</head>

<body>

<button id="startBtn">Start AR</button>

<a-scene
mindar-image="imageTargetSrc: ./targets.mind; maxTrack:1;"
color-space="sRGB"
renderer="colorManagement:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false"
embedded
>

<a-assets>

<video
id="Saranya"
src="./videos/Saranya.mp4"
playsinline
webkit-playsinline="true"
crossorigin="anonymous"
preload="auto"
loop
></video>

</a-assets>

<a-camera position="0 0 0"
look-controls="enabled:false"></a-camera>

</a-scene>


<script>

const video=document.querySelector("#Saranya");
const scene=document.querySelector("a-scene");
const startBtn=document.querySelector("#startBtn");

let unlocked=false;


// audio unlock
startBtn.onclick=async()=>{

try{

video.muted=true;

await video.play();

video.pause();

video.currentTime=0;

video.muted=false;

unlocked=true;

startBtn.classList.add("hide");

}catch(e){

console.log(e);

}

};


const TOTAL_MARKERS=30;


for(let i=0;i<TOTAL_MARKERS;i++){

let marker=document.createElement("a-entity");

marker.setAttribute(
"mindar-image-target",
`targetIndex:${i}`
);

let plane=document.createElement("a-video");

plane.setAttribute("src","#Saranya");

plane.setAttribute("width","1");

plane.setAttribute("height","1.5");

plane.setAttribute("position","0 0 0");

marker.appendChild(plane);



marker.addEventListener(
"targetFound",
()=>{

if(unlocked){

video.currentTime=0;

video.play();

}

}
);



marker.addEventListener(
"targetLost",
()=>{

video.pause();

video.currentTime=0;

}
);

scene.appendChild(marker);

}

</script>

</body>
</html>
