<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AR Album</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: sans-serif;
}

#fullscreenVideo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: black;
    display: none;
    z-index: 9999;
}

/* ఆడియో అన్‌లాక్ చేయడానికి స్టార్ట్ బటన్ స్టైల్స్ */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 10000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

#startButton {
    padding: 15px 30px;
    font-size: 18px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
}

#startButton:active {
    background-color: #0056b3;
}
</style>
</head>

<body>

<!-- స్టార్ట్ బటన్ ఓవర్లే (దీనివల్ల ఆడియో గ్యారెంటీగా వస్తుంది) -->
<div id="overlay">
    <h2>AR Album</h2>
    <p>వీడియో సౌండ్ వినడానికి కింద బటన్ నొక్కండి</p>
    <button id="startButton">START AR</button>
</div>

<video
    id="fullscreenVideo"
    playsinline
    webkit-playsinline
    controls
    preload="auto"
></video>

<!-- autoStart: false పెట్టాము, బటన్ నొక్కాకే కెమెరా స్టార్ట్ అవుతుంది -->
<a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack:1; autoStart: false;"
    embedded
    color-space="sRGB"
    renderer="colorManagement:true"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false">

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

</a-scene>

<script>
const video = document.getElementById("fullscreenVideo");
const scene = document.querySelector("a-scene");
const overlay = document.getElementById("overlay");
const startButton = document.getElementById("startButton");

const TOTAL = 30;
let audioUnlocked = false;

// బటన్ క్లిక్ చేసినప్పుడు ఆడియో అన్‌లాక్ అయి AR సీన్ స్టార్ట్ అవుతుంది
startButton.addEventListener("click", () => {
    audioUnlocked = true;
    
    // ఆడియోను ఫోర్స్ అన్‌లాక్ చేయడం కోసం ఖాళీ వీడియో ట్రిగ్గర్
    video.muted = false;
    video.volume = 1;
    video.play().then(() => {
        video.pause();
    }).catch(e => console.log("Audio unlock note:", e));

    // ఓవర్లే స్క్రీన్ దాచేయడం
    overlay.style.display = "none";

    // MindAR సీన్ స్టార్ట్ చేయడం
    const sceneEl = document.querySelector('a-scene');
    sceneEl.systems["mindar-image-system"].start(); 
});

function format(n) {
    return String(n + 1).padStart(3, '0');
}

function playVideo(index) {
    let fileName = format(index);

    video.pause();
    video.src = `./videos/${fileName}.mp4`;
    video.load();
    video.currentTime = 0;
    video.style.display = "block";

    // ఇక్కడ మ్యూట్ తీసేస్తున్నాము
    video.muted = false;
    video.volume = 1;

    setTimeout(() => {
        video.play().catch(err => {
            console.log("Video play failed, trying muted:", err);
            // ఒకవేళ అప్పటికీ బ్రౌజర్ ఆపితే మ్యూట్ చేసి ప్లే చేయడానికి ట్రై చేస్తుంది
            video.muted = true;
            video.play();
        });
    }, 300);
}

function stopVideo() {
    video.pause();
    video.currentTime = 0;
    video.style.display = "none";
}

window.addEventListener("load", () => {
    for (let i = 0; i < TOTAL; i++) {
        let marker = document.createElement("a-entity");
        marker.setAttribute("mindar-image-target", `targetIndex:${i}`);
        
        marker.addEventListener("targetFound", () => playVideo(i));
        marker.addEventListener("targetLost", stopVideo);
        
        scene.appendChild(marker);
    }
});
</script>

</body>
</html>
