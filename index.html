<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AR Album</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body{
margin:0;
overflow:hidden;
}

#fullscreenVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
background:black;
display:none;
z-index:999;
}
</style>
</head>

<body>

<video
id="fullscreenVideo"
playsinline
webkit-playsinline
muted
></video>

<a-scene
mindar-image="imageTargetSrc: ./targets.mind; maxTrack:1;"
embedded
color-space="sRGB"
renderer="colorManagement:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false"
>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

</a-scene>

<script>

window.addEventListener("DOMContentLoaded",()=>{

const video=document.querySelector("#fullscreenVideo");
const scene=document.querySelector("a-scene");

const TOTAL=30;

function format(n){
return String(n+1).padStart(3,'0');
}

function playVideo(index){

let fileName=format(index);

video.pause();

video.src=`./videos/${fileName}.mp4`;

video.load();

video.style.display="block";

video.currentTime=0;

setTimeout(()=>{

video.play().catch(err=>console.log(err));

},300);

}

function stopVideo(){

video.pause();

video.currentTime=0;

video.style.display="none";

}

for(let i=0;i<TOTAL;i++){

let marker=document.createElement("a-entity");

marker.setAttribute(
"mindar-image-target",
`targetIndex:${i}`
);

marker.addEventListener(
"targetFound",
()=>playVideo(i)
);

marker.addEventListener(
"targetLost",
stopVideo
);

scene.appendChild(marker);

}

});

</script>

</body>
</html>
