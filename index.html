<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Album</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body{
margin:0;
overflow:hidden;
}

#fullscreenVideo{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:contain;
background:black;
display:none;
z-index:9999;
}
</style>
</head>

<body>

<video
id="fullscreenVideo"
playsinline
webkit-playsinline
muted
></video>

<a-scene
mindar-image="imageTargetSrc: ./targets.mind; maxTrack:1;"
color-space="sRGB"
renderer="colorManagement:true"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false"
>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

</a-scene>

<script>

const video=document.querySelector("#fullscreenVideo");

document.querySelector("a-scene")
.addEventListener("loaded",()=>{

const scene=document.querySelector("a-scene");

const TOTAL_MARKERS=30;

function playVideo(index){

let num=String(index+1).padStart(3,'0');

// Example:
//001.mp4
//002.mp4

video.src=`./videos/${num}.mp4`;

video.style.display="block";

video.currentTime=0;

video.play();

}

function stopVideo(){

video.pause();

video.style.display="none";

}

for(let i=0;i<TOTAL_MARKERS;i++){

let marker=document.createElement("a-entity");

marker.setAttribute(
"mindar-image-target",
`targetIndex:${i}`
);

marker.addEventListener(
"targetFound",
()=>playVideo(i)
);

marker.addEventListener(
"targetLost",
stopVideo
);

scene.appendChild(marker);

}

});

</script>

</body>
</html>
